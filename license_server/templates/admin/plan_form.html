{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if plan else 'Create' }} Plan - ConvertManager{% endblock %}
{% block page_title %}{{ 'Edit' if plan else 'Create' }} Plan{% endblock %}
{% block content %}
<div class="form-page"><div class="form-card">
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-grid">
<div class="form-group"><label for="code">Code</label><input id="code" name="code" required value="{{ plan.code if plan else '' }}"></div>
<div class="form-group"><label for="name">Name</label><input id="name" name="name" required value="{{ plan.name if plan else '' }}"></div>
<div class="form-group"><label for="type">Type</label><select id="type" name="type"><option value="PERSONAL" {% if plan and plan.type == 'PERSONAL' %}selected{% endif %}>Personal</option><option value="COMPANY" {% if plan and plan.type == 'COMPANY' %}selected{% endif %}>Company</option></select></div>
<div class="form-group"><label for="price">Price</label><input id="price" name="price" type="number" step="0.01" min="0" required value="{{ plan.price if plan else '0.00' }}"></div>
<div class="form-group"><label for="max_devices">Maximum Devices</label><input id="max_devices" name="max_devices" type="number" min="1" required value="{{ plan.max_devices if plan else 1 }}"></div>
<div class="form-group"><label for="duration_days">Duration (days)</label><input id="duration_days" name="duration_days" type="number" min="1" placeholder="Leave empty for lifetime" value="{{ plan.duration_days if plan and plan.duration_days else '' }}"></div>
</div>
<div class="form-group"><label for="features">Features (one per line)</label><textarea id="features" name="features" rows="5">{% if plan %}{{ plan.feature_list()|join('\n') }}{% endif %}</textarea></div>
<div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('admin.plans') }}">Cancel</a><button class="btn btn-primary" type="submit">Save Plan</button></div>
</form>
</div></div>
{% endblock %}
