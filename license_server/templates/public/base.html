<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}ConvertManager{% endblock %}
    </title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >

</head>


<body class="public-page">

<div class="public-shell">


<header class="public-topbar">


    <a
        href="{{ url_for('public.home') }}"
        class="brand-wrap brand-home"
    >

        <div class="brand-icon">
            C
        </div>


        <div>

            <strong>
                ConvertManager
            </strong>

            <span>
                File Conversion Software
            </span>

        </div>

    </a>


    <nav class="public-nav">

        <a href="{{ url_for('public.home') }}">
            Home
        </a>


        <a href="{{ url_for('public.plans') }}">
            Plans
        </a>


        <a href="{{ url_for('admin.login') }}">
            Admin
        </a>

    </nav>


</header>


<main class="public-content">


    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <div class="flash">

                {{ message }}

            </div>

        {% endfor %}

    {% endwith %}


    {% block content %}
    {% endblock %}


</main>


<footer class="public-footer">

    <p>
        © 2026 ConvertManager · Version 1.0.0
    </p>

</footer>


</div>

</body>

</html>
